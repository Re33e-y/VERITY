 17px; line-height: 1.5; width: 100%; overflow-x: hidden\" data-canvas-width=\"1360\" data-canvas-height=\"4700\">\n\n<!-- NAV -->\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 48px; border-bottom: 2px solid #111111\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.06em\">\n<svg sc-camel-view-box=\"0 0 14 14\" width=\"30\" height=\"30\" shape-rendering=\"crispEdges\" aria-hidden=\"true\"><g fill=\"#111111\"><rect x=\"4\" y=\"0\" width=\"6\" height=\"1\"><\u002Frect><rect x=\"2\" y=\"1\" width=\"10\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"2\" width=\"12\" height=\"10\"><\u002Frect><rect x=\"1\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"5\" y=\"12\" width=\"4\" height=\"1\"><\u002Frect><rect x=\"10\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><\u002Fg><rect x=\"3\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><rect x=\"8\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><\u002Fsvg>\nVERITY\n<\u002Fa>\n<nav style=\"display: flex; flex-wrap: wrap; gap: 28px; font-weight: 500; font-size: 16px\">\n<a href=\"#architecture\" style=\"text-decoration: none\">Architecture<\u002Fa>\n<a href=\"#split\" style=\"text-decoration: none\">Division of labor<\u002Fa>\n<a href=\"#lifecycle\" style=\"text-decoration: none\">Lifecycle<\u002Fa>\n<a href=\"#report\" style=\"text-decoration: none\">Audit trail<\u002Fa>\n<\u002Fnav>\n<a href=\"#try\" style=\"background: #111111; color: #F4F1EA; padding: 12px 20px; border: 2px solid #111111; box-shadow: 4px 4px 0 {{accent}}; text-decoration: none; font-weight: 700; font-size: 16px\">Run an audit →<\u002Fa>\n<\u002Fheader>\n\n<!-- HERO -->\n<section style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding: 72px 48px 80px; max-width: 1264px; margin: 0 auto; box-sizing: content-box\">\n<div style=\"flex: 1 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"align-self: flex-start; border: 2px solid #111111; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; background: #FFFDF8\">Agentic brand governance &amp; verification<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: clamp(40px, 7vw, 78px); line-height: 1.04; letter-spacing: -0.01em\">AI reasons.<br><span style=\"background: {{accent}}; padding: 0 10px\">Code verifies.<\u002Fspan><br>Humans govern.<\u002Fh1>\n<p style=\"margin: 0; max-width: 560px; font-size: 20px; line-height: 1.5; color: #3A3832\">Verity sends your marketing copy through a team of specialist AI agents. Then deterministic code has to prove every finding and every fix. Nothing is approved until a person says so.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#architecture\" style=\"background: #111111; color: #F4F1EA; padding: 14px 22px; border: 2px solid #111111; box-shadow: 5px 5px 0 {{accent}}; text-decoration: none; font-weight: 700\">See the architecture ↓<\u002Fa>\n<a href=\"#lifecycle\" style=\"background: #FFFDF8; color: #111111; padding: 14px 22px; border: 2px solid #111111; box-shadow: 5px 5px 0 #111111; text-decoration: none; font-weight: 700\">How a review runs<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 400px; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center\">\n<svg class=\"float\" sc-camel-view-box=\"0 0 14 14\" width=\"170\" height=\"170\" shape-rendering=\"crispEdges\" role=\"img\" aria-label=\"Verity pixel ghost mascot\" style=\"position: relative; z-index: 2; margin-bottom: -34px; align-self: flex-end; margin-right: 24px\">\n<g fill=\"#111111\"><rect x=\"4\" y=\"0\" width=\"6\" height=\"1\"><\u002Frect><rect x=\"2\" y=\"1\" width=\"10\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"2\" width=\"12\" height=\"10\"><\u002Frect><rect x=\"1\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"5\" y=\"12\" width=\"4\" height=\"1\"><\u002Frect><rect x=\"10\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><rect x=\"6\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><rect x=\"11\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><\u002Fg>\n<rect x=\"3\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><rect x=\"8\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect>\n<rect x=\"4\" y=\"5\" width=\"2\" height=\"2\" fill=\"#FF6B5B\"><\u002Frect><rect x=\"9\" y=\"5\" width=\"2\" height=\"2\" fill=\"#FF6B5B\"><\u002Frect>\n<rect x=\"6\" y=\"9\" width=\"2\" height=\"1\" fill=\"#F4F1EA\"><\u002Frect>\n<\u002Fsvg>\n<div style=\"width: 100%; box-sizing: border-box; background: #111111; color: #F4F1EA; border: 2px solid #111111; box-shadow: 8px 8px 0 {{accent}}; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #CFCAC0\"><span>Finding 01 of 03<\u002Fspan><span>Illustrative example<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 22px; line-height: 1.3; font-weight: 500\">“Our <mark style=\"background: #FFD166; color: #111111; padding: 0 4px\">free trial lasts 30 days<\u002Fmark>.”<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600\">\n<span style=\"background: #FF6B5B; color: #111111; padding: 4px 8px\">CONTRADICTED<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">SEVERITY: HIGH<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">EVIDENCE: CANON-CITED<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">CONFIDENCE: 0.90<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border-left: 3px solid #7BE0A4; padding-left: 12px; color: #CFCAC0; font-size: 15px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #7BE0A4; font-weight: 600\">F-TRIAL<\u002Fspan> · The free trial lasts 14 days.<\u002Fdiv>\n<div style=\"background: #1E1E1E; padding: 12px 14px; font-size: 15px\"><span style=\"color: #CFCAC0\">Suggested fix<\u002Fspan><br>“the free trial lasts 14 days” <span style=\"margin-left: 8px; background: #7BE0A4; color: #111111; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; white-space: nowrap\">✓ RE-VERIFIED OFFLINE<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: #7BE0A4; color: #111111; border: 0; padding: 10px 18px; min-height: 44px\">Approve<\u002Fbutton>\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: transparent; color: #F4F1EA; border: 2px solid #F4F1EA; padding: 8px 18px; min-height: 44px\">Reject<\u002Fbutton>\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: transparent; color: #F4F1EA; border: 2px solid #F4F1EA; padding: 8px 18px; min-height: 44px\">Revise<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- NUMBERS -->\n<section style=\"border-top: 2px solid #111111; border-bottom: 2px solid #111111; background: #FFFDF8\">\n<div style=\"max-width: 1264px; margin: 0 auto; display: flex; flex-wrap: wrap\">\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">0<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">model calls on reviews the rules can settle<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">≤ 2<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">model calls per review in auto mode, a hard cap<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">Grade A<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">deterministic evidence no model can overrule<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">100%<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">of suggested fixes re-checked before you see them<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ARCHITECTURE -->\n\n\n<!-- DIVISION OF LABOR -->\n<section id=\"architecture\" style=\"background: #111111; color: #F4F1EA; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}\">The architecture<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">An agent-led review, with code holding the line<\u002Fh2>\n<p style=\"margin: 0 0 20px; max-width: 700px; font-size: 19px; color: #CFCAC0\">Agents understand the context and plan the work. The deterministic engine is not a fallback. It is the verification layer every agent finding has to pass through.<\u002Fp>\n\n<!-- Layer 1 -->\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">01<br>INPUT &amp; CONTEXT<\u002Fdiv>\n<div style=\"flex: 1 1 520px; border: 2px dashed #8E897E; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Marketing copy<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Brand Canon (versioned)<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Approved facts<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Policies<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: {{accent}}; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n<!-- Layer 2 -->\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">02<br>CORE<br>INTELLIGENCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; background: #F4F1EA; color: #111111; border: 2px solid #F4F1EA; box-shadow: 6px 6px 0 {{accent}}; padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #111111; color: #F4F1EA; padding: 16px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n<div><div style=\"font-weight: 700; font-size: 20px\">Orchestrator Agent<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Understands the task, builds the plan, routes work, tracks the call budget.<\u002Fdiv><\u002Fdiv>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; background: #7BE0A4; color: #111111; padding: 4px 8px; white-space: nowrap\">CODE · 0 TOKENS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Claim Verification<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Evidence and factual accuracy against approved facts.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Brand Compliance &amp; Voice<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Rules, terminology, tone and brand identity.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Risk Intelligence<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Legal and reputational flags, escalated to a human.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border: 2px solid #111111; background: {{accent}}; padding: 14px 18px\"><div style=\"font-weight: 700\">Critic &amp; Consensus Agent<\u002Fdiv><div style=\"font-size: 15px\">Challenges findings, resolves disagreements, reports uncertainty. It never just votes: deterministic evidence cannot be outvoted.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: {{accent}}; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n<!-- Layer 3 -->\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">03<br>VERIFICATION<br>&amp; EVIDENCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 2px solid #7BE0A4; padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center\"><div style=\"font-weight: 700; font-size: 20px; color: #7BE0A4\">Deterministic Verification Engine<\u002Fdiv><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; border: 1px solid #7BE0A4; color: #7BE0A4; padding: 3px 8px\">THE LAST WORD<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Rule validation<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Brand Canon matching<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Numbers, dates, quantities<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Expiry &amp; negation checks<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Injection detection<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Patch re-verification<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: {{accent}}; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n<!-- Layer 4 -->\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">04<br>HUMAN<br>GOVERNANCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 2px solid #FFD166; padding: 22px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Approve<\u002Fspan>\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Reject<\u002Fspan>\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Request revision<\u002Fspan>\n<\u002Fdiv>\n<div style=\"color: #CFCAC0; font-size: 15px; max-width: 320px\">Every decision is saved with its reason, next to the findings, evidence, patches and agent trace.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 15px; color: #CFCAC0; max-width: 760px\">Brand Compliance and Brand Voice run as one agent today, so the whole review stays inside a two-call budget. They split when the budget allows.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection><section id=\"split\" style=\"padding: 96px 48px; max-width: 1264px; margin: 0 auto; box-sizing: border-box\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">Division of labor<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Each part does the one job it is good at<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 {{accent}}; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">AI reasons<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Reads the context and intent<\u002Fli><li>Finds the approved evidence<\u002Fli><li>Proposes minimal rewrites<\u002Fli><li>Challenges its own findings<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 #7BE0A4; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">Code verifies<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Exact numbers, dates and quantities<\u002Fli><li>Explicit brand restrictions<\u002Fli><li>Injection and restricted content<\u002Fli><li>Re-checks every proposed patch<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 #FFD166; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">Humans govern<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Approve, reject or revise<\u002Fli><li>Decide every high-risk claim<\u002Fli><li>Leave a reason for the record<\u002Fli><li>Hold the final authority<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- LIFECYCLE -->\n<section id=\"lifecycle\" style=\"background: #FFFDF8; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">The lifecycle<\u002Fdiv>\n<h2 style=\"margin: 0 0 24px; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Ten controlled steps, not a pile of prompts<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">01<\u002Fdiv><div style=\"font-weight: 700\">Ingest<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Draft, metadata and the Canon version arrive.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">02<\u002Fdiv><div style=\"font-weight: 700\">Understand<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">The orchestrator extracts claims and plans the review.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">03<\u002Fdiv><div style=\"font-weight: 700\">Delegate<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Specialists get only what code could not settle.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">04<\u002Fdiv><div style=\"font-weight: 700\">Verify evidence<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Facts, rules and exact numbers checked by code.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">05<\u002Fdiv><div style=\"font-weight: 700\">Critique<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">The critic weighs disagreements and missing evidence.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">06<\u002Fdiv><div style=\"font-weight: 700\">Classify risk<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Severity, confidence and evidence kept apart.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">07<\u002Fdiv><div style=\"font-weight: 700\">Plan fixes<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Rewrites that keep the author's meaning.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">08<\u002Fdiv><div style=\"font-weight: 700\">Re-verify<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Every patch is re-checked. Failures are rejected.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: {{accent}}; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700\">09<\u002Fdiv><div style=\"font-weight: 700\">Human decision<\u002Fdiv><div style=\"font-size: 15px\">Approve, reject or revise, with a reason.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">10<\u002Fdiv><div style=\"font-weight: 700\">Audit<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Findings, trace, patches and decisions are saved.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHEN AGENTS DISAGREE -->\n<section style=\"padding: 96px 48px; max-width: 1264px; margin: 0 auto; box-sizing: border-box\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">Guardrails<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">When agents disagree, evidence wins<\u002Fh2>\n<p style=\"margin: 0; max-width: 700px; font-size: 19px; color: #3A3832\">Verity never forces a consensus the evidence does not support. These rules are code, not prompts.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 2px solid #111111; background: #FFFDF8; box-shadow: 6px 6px 0 #111111\">\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">Agents disagree<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The critic investigates. A vote does not decide.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A hard rule is violated<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The violation is preserved. No model can clear it.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">Evidence is missing<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">Marked unverifiable, never invented or assumed false.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A rewrite fails the re-check<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The patch is rejected and never shown as a fix.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">An agent cannot finish<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">A partial result returns with an explicit failure status.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A claim is high risk<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">Escalated to a qualified human reviewer.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- AUDIT TRAIL -->\n<section id=\"report\" style=\"background: #111111; color: #F4F1EA; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: {{accent}}\">Audit trail<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Inspect the agents' work, not just a final score<\u002Fh2>\n<p style=\"margin: 0 0 24px; max-width: 700px; font-size: 19px; color: #CFCAC0\">Every review saves who did what, what evidence was used and what a human decided. Illustrative example below.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #F4F1EA; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1\">04<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Agents involved<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1\">03<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Findings<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1; color: #FFD166\">01<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Needs review<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #CFCAC0\">AGENT EXECUTION TRACE<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Orchestrator <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Extracted 3 claims and planned the review.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Claim Verification <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Found a claim that contradicts an approved fact.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Brand Compliance &amp; Voice <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Checked approved terminology and brand rules.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #FFD166; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Risk Intelligence <span style=\"font-weight: 400; color: #CFCAC0\">· escalated<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Flagged an absolute guarantee for human review.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Critic &amp; Consensus <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Reviewed the evidence and consolidated the findings.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #F4F1EA; color: #111111; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 6px 6px 0 {{accent}}\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #3A3832\">THREE SEPARATE SIGNALS<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #111111; padding-bottom: 10px\"><span>Severity<\u002Fspan><b>HIGH<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #111111; padding-bottom: 10px\"><span>Evidence strength<\u002Fspan><b>CANON-CITED<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Model confidence<\u002Fspan><b>0.90<\u002Fb><\u002Fdiv>\n<div style=\"font-size: 15px; color: #3A3832\">Impact, proof and certainty are never blended into one number. A confident model cannot raise the evidence level.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border: 2px solid #F4F1EA; padding: 20px; color: #CFCAC0; font-size: 15px\">Stored per review: the plan, every agent step, suppressed findings, verified patches, the critic's disagreements and each human decision.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section id=\"try\" style=\"background: {{accent}}; border-bottom: 2px solid #111111; padding: 80px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px\">\n<h2 style=\"margin: 0; flex: 1 1 520px; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Paste your copy. See what the agents found.<\u002Fh2>\n<a href=\"#top\" style=\"background: #111111; color: #F4F1EA; padding: 18px 28px; border: 2px solid #111111; box-shadow: 6px 6px 0 #F4F1EA; text-decoration: none; font-weight: 700; font-size: 18px\">Open the review tool →<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"padding: 36px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 15px; color: #3A3832\">\n<div><b style=\"color: #111111; font-family: 'Pixelify Sans', monospace; letter-spacing: 0.06em\">VERITY<\u002Fb> · Agentic brand governance and content verification<\u002Fdiv>\n<div>AI reasons. Code verifies. Humans govern.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fstyle>\n\n<div id=\"top\" style=\"background: #F4F1EA; color: #111111; font-family: 'Space Grotesk', system-ui, sans-serif; font-size: 17px; line-height: 1.5; width: 100%; overflow-x: hidden\" data-canvas-width=\"1360\" data-canvas-height=\"4700\" data-document-role=\"page\" data-label=\"Landing page\">\n\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 48px; border-bottom: 2px solid #111111\">\n<a href=\"#top\" style=\"display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.06em\">\n<svg viewBox=\"0 0 14 14\" width=\"30\" height=\"30\" shape-rendering=\"crispEdges\" aria-hidden=\"true\"><g fill=\"#111111\"><rect x=\"4\" y=\"0\" width=\"6\" height=\"1\"><\u002Frect><rect x=\"2\" y=\"1\" width=\"10\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"2\" width=\"12\" height=\"10\"><\u002Frect><rect x=\"1\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"5\" y=\"12\" width=\"4\" height=\"1\"><\u002Frect><rect x=\"10\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><\u002Fg><rect x=\"3\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><rect x=\"8\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><\u002Fsvg>\nVERITY\n<\u002Fa>\n<nav style=\"display: flex; flex-wrap: wrap; gap: 28px; font-weight: 500; font-size: 16px\">\n<a href=\"#architecture\" style=\"text-decoration: none\">Architecture<\u002Fa>\n<a href=\"#split\" style=\"text-decoration: none\">Division of labor<\u002Fa>\n<a href=\"#lifecycle\" style=\"text-decoration: none\">Lifecycle<\u002Fa>\n<a href=\"#report\" style=\"text-decoration: none\">Audit trail<\u002Fa>\n<\u002Fnav>\n<a href=\"#try\" style=\"background: #111111; color: #F4F1EA; padding: 12px 20px; border: 2px solid #111111; box-shadow: 4px 4px 0 #FF6B5B; text-decoration: none; font-weight: 700; font-size: 16px\">Run an audit →<\u002Fa>\n<\u002Fheader>\n\n\n<section style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 56px; padding: 72px 48px 80px; max-width: 1264px; margin: 0 auto; box-sizing: content-box\">\n<div style=\"flex: 1 1 540px; min-width: 0; display: flex; flex-direction: column; gap: 28px\">\n<div style=\"align-self: flex-start; border: 2px solid #111111; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; background: #FFFDF8\">Agentic brand governance &amp; verification<\u002Fdiv>\n<h1 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-weight: 700; font-size: clamp(40px, 7vw, 78px); line-height: 1.04; letter-spacing: -0.01em\">AI reasons.<br><span style=\"background: #FF6B5B; padding: 0 10px\">Code verifies.<\u002Fspan><br>Humans govern.<\u002Fh1>\n<p style=\"margin: 0; max-width: 560px; font-size: 20px; line-height: 1.5; color: #3A3832\">Verity sends your marketing copy through a team of specialist AI agents. Then deterministic code has to prove every finding and every fix. Nothing is approved until a person says so.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<a href=\"#architecture\" style=\"background: #111111; color: #F4F1EA; padding: 14px 22px; border: 2px solid #111111; box-shadow: 5px 5px 0 #FF6B5B; text-decoration: none; font-weight: 700\">See the architecture ↓<\u002Fa>\n<a href=\"#lifecycle\" style=\"background: #FFFDF8; color: #111111; padding: 14px 22px; border: 2px solid #111111; box-shadow: 5px 5px 0 #111111; text-decoration: none; font-weight: 700\">How a review runs<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex: 1 1 400px; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center\">\n<svg class=\"float\" viewBox=\"0 0 14 14\" width=\"170\" height=\"170\" shape-rendering=\"crispEdges\" role=\"img\" aria-label=\"Verity pixel ghost mascot\" style=\"position: relative; z-index: 2; margin-bottom: -34px; align-self: flex-end; margin-right: 24px\">\n<g fill=\"#111111\"><rect x=\"4\" y=\"0\" width=\"6\" height=\"1\"><\u002Frect><rect x=\"2\" y=\"1\" width=\"10\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"2\" width=\"12\" height=\"10\"><\u002Frect><rect x=\"1\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"5\" y=\"12\" width=\"4\" height=\"1\"><\u002Frect><rect x=\"10\" y=\"12\" width=\"3\" height=\"1\"><\u002Frect><rect x=\"1\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><rect x=\"6\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><rect x=\"11\" y=\"13\" width=\"2\" height=\"1\"><\u002Frect><\u002Fg>\n<rect x=\"3\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect><rect x=\"8\" y=\"4\" width=\"3\" height=\"3\" fill=\"#F4F1EA\"><\u002Frect>\n<rect x=\"4\" y=\"5\" width=\"2\" height=\"2\" fill=\"#FF6B5B\"><\u002Frect><rect x=\"9\" y=\"5\" width=\"2\" height=\"2\" fill=\"#FF6B5B\"><\u002Frect>\n<rect x=\"6\" y=\"9\" width=\"2\" height=\"1\" fill=\"#F4F1EA\"><\u002Frect>\n<\u002Fsvg>\n<div style=\"width: 100%; box-sizing: border-box; background: #111111; color: #F4F1EA; border: 2px solid #111111; box-shadow: 8px 8px 0 #FF6B5B; padding: 24px; display: flex; flex-direction: column; gap: 16px; position: relative; z-index: 1\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #CFCAC0\"><span>Finding 01 of 03<\u002Fspan><span>Illustrative example<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0; font-size: 22px; line-height: 1.3; font-weight: 500\">“Our <mark style=\"background: #FFD166; color: #111111; padding: 0 4px\">free trial lasts 30 days<\u002Fmark>.”<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600\">\n<span style=\"background: #FF6B5B; color: #111111; padding: 4px 8px\">CONTRADICTED<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">SEVERITY: HIGH<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">EVIDENCE: CANON-CITED<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 3px 8px\">CONFIDENCE: 0.90<\u002Fspan>\n<\u002Fdiv>\n<div style=\"border-left: 3px solid #7BE0A4; padding-left: 12px; color: #CFCAC0; font-size: 15px\"><span style=\"font-family: 'JetBrains Mono', monospace; color: #7BE0A4; font-weight: 600\">F-TRIAL<\u002Fspan> · The free trial lasts 14 days.<\u002Fdiv>\n<div style=\"background: #1E1E1E; padding: 12px 14px; font-size: 15px\"><span style=\"color: #CFCAC0\">Suggested fix<\u002Fspan><br>“the free trial lasts 14 days” <span style=\"margin-left: 8px; background: #7BE0A4; color: #111111; padding: 2px 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; white-space: nowrap\">✓ RE-VERIFIED OFFLINE<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: #7BE0A4; color: #111111; border: 0; padding: 10px 18px; min-height: 44px\">Approve<\u002Fbutton>\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: transparent; color: #F4F1EA; border: 2px solid #F4F1EA; padding: 8px 18px; min-height: 44px\">Reject<\u002Fbutton>\n<button type=\"button\" style=\"font: inherit; font-weight: 700; background: transparent; color: #F4F1EA; border: 2px solid #F4F1EA; padding: 8px 18px; min-height: 44px\">Revise<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"border-top: 2px solid #111111; border-bottom: 2px solid #111111; background: #FFFDF8\">\n<div style=\"max-width: 1264px; margin: 0 auto; display: flex; flex-wrap: wrap\">\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">0<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">model calls on reviews the rules can settle<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">≤ 2<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">model calls per review in auto mode, a hard cap<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px; border-right: 2px solid #111111\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">Grade A<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">deterministic evidence no model can overrule<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 260px; padding: 28px 48px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 44px; font-weight: 700; line-height: 1\">100%<\u002Fdiv><div style=\"margin-top: 6px; color: #3A3832\">of suggested fixes re-checked before you see them<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n\n\n\n<section id=\"architecture\" style=\"background: #111111; color: #F4F1EA; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #FF6B5B\">The architecture<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">An agent-led review, with code holding the line<\u002Fh2>\n<p style=\"margin: 0 0 20px; max-width: 700px; font-size: 19px; color: #CFCAC0\">Agents understand the context and plan the work. The deterministic engine is not a fallback. It is the verification layer every agent finding has to pass through.<\u002Fp>\n\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">01<br>INPUT &amp; CONTEXT<\u002Fdiv>\n<div style=\"flex: 1 1 520px; border: 2px dashed #8E897E; padding: 18px 22px; display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Marketing copy<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Brand Canon (versioned)<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Approved facts<\u002Fspan>\n<span style=\"border: 1px solid #F4F1EA; padding: 6px 12px\">Policies<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: #FF6B5B; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">02<br>CORE<br>INTELLIGENCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; background: #F4F1EA; color: #111111; border: 2px solid #F4F1EA; box-shadow: 6px 6px 0 #FF6B5B; padding: 22px; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #111111; color: #F4F1EA; padding: 16px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px\">\n<div><div style=\"font-weight: 700; font-size: 20px\">Orchestrator Agent<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Understands the task, builds the plan, routes work, tracks the call budget.<\u002Fdiv><\u002Fdiv>\n<span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; background: #7BE0A4; color: #111111; padding: 4px 8px; white-space: nowrap\">CODE · 0 TOKENS<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 14px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Claim Verification<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Evidence and factual accuracy against approved facts.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Brand Compliance &amp; Voice<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Rules, terminology, tone and brand identity.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; padding: 14px 16px; background: #FFFDF8\"><div style=\"font-weight: 700\">Risk Intelligence<\u002Fdiv><div style=\"color: #3A3832; font-size: 15px\">Legal and reputational flags, escalated to a human.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border: 2px solid #111111; background: #FF6B5B; padding: 14px 18px\"><div style=\"font-weight: 700\">Critic &amp; Consensus Agent<\u002Fdiv><div style=\"font-size: 15px\">Challenges findings, resolves disagreements, reports uncertainty. It never just votes: deterministic evidence cannot be outvoted.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: #FF6B5B; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">03<br>VERIFICATION<br>&amp; EVIDENCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 2px solid #7BE0A4; padding: 22px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center\"><div style=\"font-weight: 700; font-size: 20px; color: #7BE0A4\">Deterministic Verification Engine<\u002Fdiv><span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; border: 1px solid #7BE0A4; color: #7BE0A4; padding: 3px 8px\">THE LAST WORD<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Rule validation<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Brand Canon matching<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Numbers, dates, quantities<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Expiry &amp; negation checks<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Injection detection<\u002Fspan>\n<span style=\"background: #1E1E1E; padding: 6px 12px\">Patch re-verification<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding-left: 190px; color: #FF6B5B; font-size: 22px; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch\">\n<div style=\"flex: 0 0 170px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.08em; color: #CFCAC0; padding-top: 18px\">04<br>HUMAN<br>GOVERNANCE<\u002Fdiv>\n<div style=\"flex: 1 1 520px; min-width: 0; border: 2px solid #FFD166; padding: 22px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Approve<\u002Fspan>\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Reject<\u002Fspan>\n<span style=\"background: #FFD166; color: #111111; font-weight: 700; padding: 8px 16px\">Request revision<\u002Fspan>\n<\u002Fdiv>\n<div style=\"color: #CFCAC0; font-size: 15px; max-width: 320px\">Every decision is saved with its reason, next to the findings, evidence, patches and agent trace.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; font-size: 15px; color: #CFCAC0; max-width: 760px\">Brand Compliance and Brand Voice run as one agent today, so the whole review stays inside a two-call budget. They split when the budget allows.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection><section id=\"split\" style=\"padding: 96px 48px; max-width: 1264px; margin: 0 auto; box-sizing: border-box\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">Division of labor<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Each part does the one job it is good at<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 #FF6B5B; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">AI reasons<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Reads the context and intent<\u002Fli><li>Finds the approved evidence<\u002Fli><li>Proposes minimal rewrites<\u002Fli><li>Challenges its own findings<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 #7BE0A4; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">Code verifies<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Exact numbers, dates and quantities<\u002Fli><li>Explicit brand restrictions<\u002Fli><li>Injection and restricted content<\u002Fli><li>Re-checks every proposed patch<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<div style=\"flex: 1 1 300px; background: #FFFDF8; border: 2px solid #111111; box-shadow: 6px 6px 0 #FFD166; padding: 28px; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700\">Humans govern<\u002Fdiv>\n<ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: #3A3832\"><li>Approve, reject or revise<\u002Fli><li>Decide every high-risk claim<\u002Fli><li>Leave a reason for the record<\u002Fli><li>Hold the final authority<\u002Fli><\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"lifecycle\" style=\"background: #FFFDF8; border-top: 2px solid #111111; border-bottom: 2px solid #111111; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">The lifecycle<\u002Fdiv>\n<h2 style=\"margin: 0 0 24px; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Ten controlled steps, not a pile of prompts<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">01<\u002Fdiv><div style=\"font-weight: 700\">Ingest<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Draft, metadata and the Canon version arrive.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">02<\u002Fdiv><div style=\"font-weight: 700\">Understand<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">The orchestrator extracts claims and plans the review.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">03<\u002Fdiv><div style=\"font-weight: 700\">Delegate<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Specialists get only what code could not settle.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">04<\u002Fdiv><div style=\"font-weight: 700\">Verify evidence<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Facts, rules and exact numbers checked by code.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">05<\u002Fdiv><div style=\"font-weight: 700\">Critique<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">The critic weighs disagreements and missing evidence.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">06<\u002Fdiv><div style=\"font-weight: 700\">Classify risk<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Severity, confidence and evidence kept apart.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">07<\u002Fdiv><div style=\"font-weight: 700\">Plan fixes<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Rewrites that keep the author's meaning.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">08<\u002Fdiv><div style=\"font-weight: 700\">Re-verify<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Every patch is re-checked. Failures are rejected.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #FF6B5B; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700\">09<\u002Fdiv><div style=\"font-weight: 700\">Human decision<\u002Fdiv><div style=\"font-size: 15px\">Approve, reject or revise, with a reason.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 200px; border: 2px solid #111111; background: #F4F1EA; padding: 18px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 32px; font-weight: 700; color: #B93A2B\">10<\u002Fdiv><div style=\"font-weight: 700\">Audit<\u002Fdiv><div style=\"font-size: 15px; color: #3A3832\">Findings, trace, patches and decisions are saved.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"padding: 96px 48px; max-width: 1264px; margin: 0 auto; box-sizing: border-box\">\n<div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #B93A2B\">Guardrails<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">When agents disagree, evidence wins<\u002Fh2>\n<p style=\"margin: 0; max-width: 700px; font-size: 19px; color: #3A3832\">Verity never forces a consensus the evidence does not support. These rules are code, not prompts.<\u002Fp>\n<\u002Fdiv>\n<div style=\"border: 2px solid #111111; background: #FFFDF8; box-shadow: 6px 6px 0 #111111\">\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">Agents disagree<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The critic investigates. A vote does not decide.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A hard rule is violated<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The violation is preserved. No model can clear it.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">Evidence is missing<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">Marked unverifiable, never invented or assumed false.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A rewrite fails the re-check<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">The patch is rejected and never shown as a fix.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; border-bottom: 2px solid #111111\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">An agent cannot finish<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">A partial result returns with an explicit failure status.<\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap\"><div style=\"flex: 1 1 300px; padding: 16px 22px; font-weight: 700\">A claim is high risk<\u002Fdiv><div style=\"flex: 1 1 300px; padding: 16px 22px; color: #3A3832\">Escalated to a qualified human reviewer.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"report\" style=\"background: #111111; color: #F4F1EA; padding: 96px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #FF6B5B\">Audit trail<\u002Fdiv>\n<h2 style=\"margin: 0; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Inspect the agents' work, not just a final score<\u002Fh2>\n<p style=\"margin: 0 0 24px; max-width: 700px; font-size: 19px; color: #CFCAC0\">Every review saves who did what, what evidence was used and what a human decided. Illustrative example below.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<div style=\"flex: 1 1 480px; min-width: 0; border: 2px solid #F4F1EA; padding: 24px; display: flex; flex-direction: column; gap: 18px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1\">04<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Agents involved<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1\">03<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Findings<\u002Fdiv><\u002Fdiv>\n<div style=\"flex: 1 1 100px; background: #1E1E1E; padding: 14px\"><div style=\"font-family: 'Pixelify Sans', monospace; font-size: 36px; font-weight: 700; line-height: 1; color: #FFD166\">01<\u002Fdiv><div style=\"color: #CFCAC0; font-size: 14px\">Needs review<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #CFCAC0\">AGENT EXECUTION TRACE<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Orchestrator <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Extracted 3 claims and planned the review.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Claim Verification <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Found a claim that contradicts an approved fact.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Brand Compliance &amp; Voice <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Checked approved terminology and brand rules.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #FFD166; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Risk Intelligence <span style=\"font-weight: 400; color: #CFCAC0\">· escalated<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Flagged an absolute guarantee for human review.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start\"><span style=\"margin-top: 7px; width: 12px; height: 12px; background: #7BE0A4; flex: none\"><\u002Fspan><div><div style=\"font-weight: 700\">Critic &amp; Consensus <span style=\"font-weight: 400; color: #CFCAC0\">· completed<\u002Fspan><\u002Fdiv><div style=\"color: #CFCAC0; font-size: 15px\">Reviewed the evidence and consolidated the findings.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"background: #F4F1EA; color: #111111; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 6px 6px 0 #FF6B5B\">\n<div style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.08em; color: #3A3832\">THREE SEPARATE SIGNALS<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #111111; padding-bottom: 10px\"><span>Severity<\u002Fspan><b>HIGH<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; border-bottom: 2px solid #111111; padding-bottom: 10px\"><span>Evidence strength<\u002Fspan><b>CANON-CITED<\u002Fb><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span>Model confidence<\u002Fspan><b>0.90<\u002Fb><\u002Fdiv>\n<div style=\"font-size: 15px; color: #3A3832\">Impact, proof and certainty are never blended into one number. A confident model cannot raise the evidence level.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border: 2px solid #F4F1EA; padding: 20px; color: #CFCAC0; font-size: 15px\">Stored per review: the plan, every agent step, suppressed findings, verified patches, the critic's disagreements and each human decision.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"try\" style=\"background: #FF6B5B; border-bottom: 2px solid #111111; padding: 80px 48px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 32px\">\n<h2 style=\"margin: 0; flex: 1 1 520px; font-family: 'Pixelify Sans', monospace; font-size: clamp(32px, 5vw, 56px); line-height: 1.08\">Paste your copy. See what the agents found.<\u002Fh2>\n<a href=\"#top\" style=\"background: #111111; color: #F4F1EA; padding: 18px 28px; border: 2px solid #111111; box-shadow: 6px 6px 0 #F4F1EA; text-decoration: none; font-weight: 700; font-size: 18px\">Open the review tool →<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<footer style=\"padding: 36px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 15px; color: #3A3832\">\n<div><b style=\"color: #111111; font-family: 'Pixelify Sans', monospace; letter-spacing: 0.06em\">VERITY<\u002Fb> · Agentic brand governance and content verification<\u002Fdiv>\n<div>AI reasons. Code verifies. Humans govern.<\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FF6B5B&quot;,&quot;options&quot;:[&quot;#FF6B5B&quot;,&quot;#7BE0A4&quot;,&quot;#FFD166&quot;,&quot;#8AB4FF&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:4700}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#FF6B5B' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
